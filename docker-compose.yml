services:
  postgres:
    image: postgres:16-alpine
    container_name: bookmanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookmanager}
      POSTGRES_USER: ${POSTGRES_USER:-bookmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookmanager123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookmanager} -d ${POSTGRES_DB:-bookmanager}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookmanager-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bookmanager}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bookmanager}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bookmanager123}
      JWT_SECRET: ${JWT_SECRET:-Y2hhbmdlLW1lLXN1cGVyLXNlY3JldC1rZXktYm9va21hbmFnZXI=}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      REFRESH_TOKEN_EXPIRATION_MS: ${REFRESH_TOKEN_EXPIRATION_MS:-604800000}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: bookmanager-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  postgres_data:
